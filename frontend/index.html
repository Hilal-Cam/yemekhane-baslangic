<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yemekhane Otomasyon Sistemi</title>
  <link rel="stylesheet" href="css/temel.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
    nav { background: #007bff; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    nav button { background: white; color: #007bff; border: none; padding: 8px 12px; margin-right: 5px; cursor: pointer; border-radius: 3px; font-weight: bold; }
    nav button:hover { background: #e2e6ea; }
    .ekran { display: none; background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .aktif { display: block; }
    input, select, button { display: block; margin: 10px 0; padding: 8px; width: 100%; max-width: 300px; }
    button.action-btn { background: #28a745; color: white; border: none; cursor: pointer; }
    button.action-btn:hover { background: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <h1>Yemekhane Otomasyon Portalı</h1>

  <!-- Menü Navigasyonu (7 Ekran) -->
  <nav>
    <button onclick="ekranGoster('giris')">1. Giriş</button>
    <button onclick="ekranGoster('bakiye')">2. Bakiye Yükle</button>
    <button onclick="ekranGoster('menu')">3. Menü & Rezervasyon</button>
    <button onclick="ekranGoster('rezervasyonlar')">4. İptal / Rezervasyonlarım</button>
    <button onclick="ekranGoster('rapor')">5. Raporlama</button>
    <button onclick="ekranGoster('yetkili')">6. Yetkili Paneli</button>
    <button onclick="ekranGoster('talep')">7. Değişiklik Talebi</button>
  </nav>

  <!-- Ekran 1: Giriş -->
  <div id="giris" class="ekran aktif">
    <h2>1. Kullanıcı Girişi</h2>
    <input type="email" id="loginEmail" placeholder="E-posta">
    <input type="password" id="loginPassword" placeholder="Şifre">
    <button class="action-btn" onclick="girisYap()">Giriş Yap</button>
    <p id="loginResult"></p>
  </div>

  <!-- Ekran 2: Bakiye Yükleme -->
  <div id="bakiye" class="ekran">
    <h2>2. Bakiye Yükleme</h2>
    <input type="number" id="bakiyeMiktar" placeholder="Yüklenecek Tutar (TL)">
    <button class="action-btn" onclick="bakiyeYukle()">Bakiye Yükle</button>
    <p id="bakiyeResult"></p>
  </div>

  <!-- Ekran 3: Menü & Rezervasyon -->
  <div id="menu" class="ekran">
    <h2>3. Yemek Menüsü ve Rezervasyon</h2>
    <button onclick="menuGetir()">Menüyü Yenile</button>
    <div id="menuListesi"></div>
  </div>

  <!-- Ekran 4: Rezervasyon İptali -->
  <div id="rezervasyonlar" class="ekran">
    <h2>4. Rezervasyonlarım ve İptal</h2>
    <button onclick="rezervasyonLisesiGetir()">Listeyi Getir</button>
    <div id="rezervasyonListesi"></div>
  </div>

  <!-- Ekran 5: İlerleme ve Raporlama -->
  <div id="rapor" class="ekran">
    <h2>5. Sistem Raporları ve İstatistikler</h2>
    <button onclick="raporAl()">Raporları Oluştur</button>
    <div id="raporSonuc" style="margin-top:15px;"></div>
  </div>

  <!-- Ekran 6: Yetkili Paneli -->
  <div id="yetkili" class="ekran">
    <h2>6. Yetkili Yönetim Paneli</h2>
    <p>Menü Ekleme / Kullanıcı Onay İşlemleri</p>
    <input type="date" id="menuTarih">
    <input type="text" id="anaYemek" placeholder="Ana Yemek">
    <button class="action-btn" onclick="alert('Menü güncelleme talebi gönderildi.')">Yemek Menüsü Ekle</button>
  </div>

  <!-- Ekran 7: Değişiklik Talepleri -->
  <div id="talep" class="ekran">
    <h2>7. Değişiklik Talepleri (İtiraz / Bildirim)</h2>
    <textarea placeholder="Talebinizi detaylandırın..." style="width:100%; max-width:400px; height:100px;"></textarea>
    <button class="action-btn" onclick="alert('Talebiniz alınmıştır.')">Talebi Gönder</button>
  </div>

  <script>
    function ekranGoster(ekranId) {
      document.querySelectorAll('.ekran').forEach(e => e.classList.remove('aktif'));
      document.getElementById(ekranId).classList.add('aktif');
    }

    async function girisYap() {
      const eposta = document.getElementById('loginEmail').value;
      const sifre = document.getElementById('loginPassword').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eposta, sifre })
      });
      const data = await res.json();
      document.getElementById('loginResult').innerText = data.success ? 'Giriş Başarılı! Hoşgeldiniz ' + data.user.ad_soyad : 'Hata: ' + data.message;
    }

    async function bakiyeYukle() {
      const miktar = document.getElementById('bakiyeMiktar').value;
      const res = await fetch('/api/bakiye-yukle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ miktar })
      });
      const data = await res.json();
      document.getElementById('bakiyeResult').innerText = data.message;
    }

    async function menuGetir() {
      const res = await fetch('/api/menu');
      const data = await res.json();
      let html = '<table><tr><th>Tarih</th><th>Ana Yemek</th><th>İşlem</th></tr>';
      data.forEach(m => {
        html += `<tr><td>${m.tarih}</td><td>${m.ana_yemek}</td><td><button onclick="rezervasyonYap(${m.id})">Rezervasyon Yap</button></td></tr>`;
      });
      html += '</table>';
      document.getElementById('menuListesi').innerHTML = html;
    }

    async function rezervasyonYap(menuId) {
      const res = await fetch('/api/rezervasyon-yap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ menuId })
      });
      const data = await res.json();
      alert(data.message);
    }

    async function rezervasyonLisesiGetir() {
      const res = await fetch('/api/rezervasyonlarim');
      const data = await res.json();
      let html = '<table><tr><th>Tarih</th><th>Yemek</th><th>Durum</th><th>İşlem</th></tr>';
      data.forEach(r => {
        html += `<tr><td>${r.tarih}</td><td>${r.ana_yemek}</td><td>${r.durum}</td><td><button onclick="rezervasyonIptal(${r.id})">İptal Et</button></td></tr>`;
      });
      html += '</table>';
      document.getElementById('rezervasyonListesi').innerHTML = html;
    }

    async function rezervasyonIptal(rezervasyonId) {
      const res = await fetch('/api/rezervasyon-iptal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rezervasyonId })
      });
      const data = await res.json();
      alert(data.message);
      rezervasyonLisesiGetir();
    }

    async function raporAl() {
      const res = await fetch('/api/raporlar');
      const data = await res.json();
      document.getElementById('raporSonuc').innerHTML = `<p><strong>Toplam Rezervasyon Sayısı:</strong> ${data.toplamRezervasyon}</p><p><strong>Toplam Sistem Bakiyesi:</strong> ${data.toplamSistemBakiyesi} TL</p>`;
    }
  </script>
</body>
</html>
